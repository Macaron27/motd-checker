name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/macaron27/motd-checker

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  docker:
    name: Docker (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Smoke test each platform
        run: |
          set -eu
          for target in linux/amd64=x64 linux/arm64=arm64; do
            platform=${target%=*} expected=${target#*=}
            echo "::group::$platform"
            docker buildx build --platform "$platform" --load -t motd-checker:smoke .
            docker run -d --name smoke --platform "$platform" --health-interval 2s \
              -e DB_HOST=db.invalid motd-checker:smoke

            # Wait for the image's own HEALTHCHECK to pass
            for i in $(seq 1 45); do
              status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
              [ "$status" = healthy ] && break
              sleep 2
            done
            docker logs smoke
            [ "$status" = healthy ] || { echo "::error::$platform container is $status"; exit 1; }

            arch=$(docker exec smoke node -p process.arch)
            uid=$(docker exec smoke id -u)
            echo "$platform -> node arch=$arch, uid=$uid"
            [ "$arch" = "$expected" ] || { echo "::error::expected $expected, got $arch"; exit 1; }
            [ "$uid" != 0 ] || { echo "::error::container runs as root"; exit 1; }

            # SIGTERM must stop the app cleanly (exit 0), not via SIGKILL (137)
            docker stop -t 10 smoke
            code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
            [ "$code" = 0 ] || { echo "::error::exit code $code after docker stop"; exit 1; }

            docker rm smoke
            docker image ls motd-checker:smoke
            echo "::endgroup::"
          done

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=pr

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
